<!DOCTYPE html>
<html lang="ko" class="w-full h-full m-0 p-0 overflow-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>화성성역: 정조의 24년 (華城城役 - SimCity 2000 에디션)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;800;900&family=Noto+Sans+KR:wght@400;600;700&display=swap');
    
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0d0a07;
      color: #ede5d8;
      font-family: 'Noto Sans KR', sans-serif;
      touch-action: none;
    }

    .font-traditional {
      font-family: 'Noto Serif KR', serif;
    }

    .hanji-card {
      background-color: #f7f1e5;
      background-image: radial-gradient(#d6c7b2 15%, transparent 16%);
      background-size: 16px 16px;
      color: #261912;
      border: 3px solid #7c2217;
      box-shadow: 0 16px 40px rgba(0,0,0,0.85), inset 0 0 0 1px #d6a46e;
    }

    .dock-btn {
      transition: transform 0.08s ease, background 0.15s ease, border-color 0.15s ease;
    }
    .dock-btn:active {
      transform: scale(0.92);
    }
    .dock-btn.active {
      background: linear-gradient(180deg, #991b1b 0%, #4c0d0d 100%) !important;
      border-color: #fbbf24 !important;
      color: #ffffff !important;
      box-shadow: 0 0 14px rgba(251, 191, 36, 0.7);
    }

    #viewport {
      position: relative;
      width: 100%;
      height: 100%;
      flex: 1 1 0%;
      min-height: 200px;
      cursor: crosshair;
      touch-action: none;
      background: radial-gradient(circle at center, #1b1510 0%, #0d0a07 100%);
    }
    #viewport.panning {
      cursor: grab;
    }
    #viewport.panning:active {
      cursor: grabbing;
    }

    #gameCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
  </style>
</head>

<body class="w-full h-full flex flex-col justify-between relative select-none">

  <!-- 상단 자원 및 연호 HUD -->
  <header id="game-header" class="relative z-20 bg-[#19130d]/95 border-b-2 border-[#6b4421] px-3 py-1.5 flex flex-wrap items-center justify-between shadow-2xl text-xs md:text-sm">
    <div class="flex items-center gap-2">
      <div id="badge-season" class="bg-[#7a1a1a] text-[#fef08a] px-3 py-1 rounded-full font-traditional font-black tracking-wide shadow-md flex items-center gap-1.5 border border-[#ca8a04]">
        <span id="txt-season-icon">🌸</span>
        <span id="txt-turn-label">정조 원년(1776) 봄 [1/96턴]</span>
      </div>
      <button id="btn-sound-toggle" class="bg-[#332216] hover:bg-[#4a3221] border border-[#7a5331] text-xs px-2.5 py-1 rounded-md text-[#fed7aa] transition shadow">
        🔊 소리
      </button>
    </div>

    <div class="flex items-center gap-3 md:gap-5 overflow-x-auto py-0.5 font-medium">
      <div class="flex items-center gap-1" title="상평통보 국고">
        <span>🪙</span>
        <span class="font-bold text-amber-300" id="hud-gold">2,500</span>
      </div>
      <div class="flex items-center gap-1 cursor-pointer hover:bg-[#251a12] px-2 py-0.5 rounded border border-[#6b4522] hover:border-emerald-500 transition shadow-sm" id="hud-rice-container" title="클릭하여 대외 곡물 교역 및 쌀 매입소 열기">
        <span>🌾</span>
        <span class="font-bold text-emerald-300" id="hud-rice">1,600</span>
        <span class="text-[9px] bg-emerald-900/90 text-emerald-200 px-1 py-0.2 rounded border border-emerald-600/60 font-bold ml-0.5">교역</span>
      </div>
      <div class="flex items-center gap-1" title="화성 신도시 인구">
        <span>👥</span>
        <span class="font-bold text-sky-300" id="hud-pop">120</span>
      </div>
      <div class="flex items-center gap-1" title="백성 충성도">
        <span>❤️</span>
        <span class="font-bold text-rose-300" id="hud-loyalty">88%</span>
      </div>
      <div class="flex items-center gap-1" title="왕권 및 국방력">
        <span>👑</span>
        <span class="font-bold text-purple-300" id="hud-authority">70</span>
      </div>
      <div class="flex items-center gap-1 bg-[#120e0b] px-2.5 py-1 rounded-md border border-[#7d5633]">
        <span title="화성 성곽 완공도">🏯</span>
        <span class="font-bold text-yellow-400" id="hud-fortress">0%</span>
      </div>
    </div>
  </header>

  <main id="viewport" class="relative flex-1 w-full overflow-hidden">
    <canvas id="gameCanvas"></canvas>

    <!-- 시점 및 도구 보조 툴바 -->
    <div class="absolute top-3 right-3 z-30 flex flex-col gap-1.5 pointer-events-auto">
      <button id="btn-undo" class="w-10 h-10 rounded-lg bg-[#251b14]/90 border border-[#7a522e] text-amber-200 font-bold text-sm flex items-center justify-center shadow-xl active:scale-95 transition opacity-40" title="실행 취소 (되돌리기)">↩️</button>
      <button id="btn-pan-toggle" class="w-10 h-10 rounded-lg bg-[#251b14]/90 border border-[#7a522e] text-amber-200 font-bold text-sm flex items-center justify-center shadow-xl active:scale-95 transition" title="화면 이동/건설 모드 전환">✋</button>
      <button id="btn-zoom-in" class="w-10 h-10 rounded-lg bg-[#251b14]/90 border border-[#7a522e] text-amber-200 font-bold text-lg flex items-center justify-center shadow-xl active:scale-95 transition">+</button>
      <button id="btn-zoom-out" class="w-10 h-10 rounded-lg bg-[#251b14]/90 border border-[#7a522e] text-amber-200 font-bold text-lg flex items-center justify-center shadow-xl active:scale-95 transition">-</button>
      <button id="btn-center-view" class="w-10 h-10 rounded-lg bg-[#251b14]/90 border border-[#7a522e] text-amber-200 font-bold text-sm flex items-center justify-center shadow-xl active:scale-95 transition" title="화면 중앙 원위치">🎯</button>
      <button id="btn-demolish-toggle" class="w-10 h-10 rounded-lg bg-[#4a0d0d]/90 border border-[#991b1b] text-red-200 font-bold text-sm flex items-center justify-center shadow-xl active:scale-95 transition" title="철거 불도저">🚜</button>
    </div>

    <!-- 현재 선택 도구 설명 툴바 -->
    <div id="tool-status-bar" class="absolute top-3 left-3 z-10 bg-[#1b130d]/95 border border-[#6f4623] px-3.5 py-2 rounded-lg text-xs flex items-center gap-2.5 shadow-2xl backdrop-blur-sm pointer-events-none max-w-[80vw]">
      <span id="tool-bar-icon" class="text-xl">🔍</span>
      <div>
        <div id="tool-bar-title" class="text-amber-200 font-bold">살피기 모드</div>
        <div id="tool-bar-desc" class="text-stone-300 text-[11px]">건물과 백성을 터치해 당대 생활상을 살핍니다. 드래그하여 시점을 이동합니다.</div>
      </div>
    </div>

    <!-- 정조의 어명 / 필수 건축 안내 배너 -->
    <div id="quest-banner" class="absolute top-16 left-3 z-20 bg-[#1b130d]/95 border border-[#ca8a04] px-3 py-1.5 rounded-lg text-xs flex items-center justify-between gap-3 shadow-2xl max-w-[85vw] md:max-w-md pointer-events-auto backdrop-blur-sm">
      <div class="flex items-center gap-2">
        <span class="text-base">📜</span>
        <div>
          <div id="quest-title" class="text-amber-300 font-bold font-traditional text-[12px]">제1교지: 행정 사령탑(동헌) 설치</div>
          <div id="quest-desc" class="text-stone-300 text-[10px]">수원유수부 동헌을 평지에 지어 신도시 성역의 기틀을 마련하십시오.</div>
        </div>
      </div>
      <button id="btn-quest-action" class="bg-[#7c2217] hover:bg-[#991b1b] border border-[#f59e0b] text-[#fef08a] px-2.5 py-1 rounded text-[11px] font-bold whitespace-nowrap active:scale-95 transition">
        터 잡기
      </button>
    </div>

    <!-- 인게임 토스트 배너 -->
    <div id="toast-banner" class="absolute top-16 left-1/2 -translate-x-1/2 z-40 bg-[#721c13] text-white px-4 py-2.5 rounded-lg border border-[#f59e0b] shadow-2xl text-xs sm:text-sm font-semibold transition-all duration-300 transform -translate-y-8 opacity-0 pointer-events-none flex items-center gap-2 max-w-[90%] text-center">
      <span id="toast-icon">📢</span>
      <span id="toast-msg">알림</span>
    </div>
  </main>

  <footer id="dock-bar" class="relative z-20 bg-[#16100b] border-t-2 border-[#5a381a] px-1 py-1.5 flex items-center justify-around gap-1 overflow-x-auto shadow-2xl">
    <button class="dock-btn active flex-1 min-w-[48px] max-w-[62px] py-1 bg-[#291d13] border border-[#5a391e] rounded-lg flex flex-col items-center justify-center text-[10px] text-amber-100" data-tool="inspect">
      <span class="text-base">🔍</span>
      <span>살피기</span>
    </button>
    <button class="dock-btn flex-1 min-w-[48px] max-w-[62px] py-1 bg-[#291d13] border border-[#5a391e] rounded-lg flex flex-col items-center justify-center text-[10px] text-amber-100" data-tool="road">
      <span class="text-base">🛣️</span>
      <span>삼남로</span>
    </button>
    <button class="dock-btn flex-1 min-w-[48px] max-w-[62px] py-1 bg-[#291d13] border border-[#5a391e] rounded-lg flex flex-col items-center justify-center text-[10px] text-amber-100" data-tool="wall">
      <span class="text-base">🧱</span>
      <span>화성성곽</span>
    </button>
    <button class="dock-btn flex-1 min-w-[48px] max-w-[62px] py-1 bg-[#291d13] border border-[#5a391e] rounded-lg flex flex-col items-center justify-center text-[10px] text-amber-100" data-tool="zone_res">
      <span class="text-base">🏡</span>
      <span>방·리</span>
    </button>
    <button class="dock-btn flex-1 min-w-[48px] max-w-[62px] py-1 bg-[#291d13] border border-[#5a391e] rounded-lg flex flex-col items-center justify-center text-[10px] text-amber-100" data-tool="zone_com">
      <span class="text-base">🏪</span>
      <span>저잣거리</span>
    </button>
    <button class="dock-btn flex-1 min-w-[48px] max-w-[62px] py-1 bg-[#291d13] border border-[#5a391e] rounded-lg flex flex-col items-center justify-center text-[10px] text-amber-100" data-tool="zone_agr">
      <span class="text-base">🌾</span>
      <span>대유둔전</span>
    </button>
    <button class="dock-btn flex-1 min-w-[48px] max-w-[62px] py-1 bg-[#291d13] border border-[#5a391e] rounded-lg flex flex-col items-center justify-center text-[10px] text-amber-100" id="btn-open-court">
      <span class="text-base">📜</span>
      <span>조정·인재</span>
    </button>
    <button class="dock-btn flex-1 min-w-[48px] max-w-[62px] py-1 bg-[#291d13] border border-[#5a391e] rounded-lg flex flex-col items-center justify-center text-[10px] text-amber-100" id="btn-open-agri">
      <span class="text-base">🌾</span>
      <span>농학·교역</span>
    </button>
    <button class="dock-btn flex-1 min-w-[48px] max-w-[62px] py-1 bg-[#291d13] border border-[#5a391e] rounded-lg flex flex-col items-center justify-center text-[10px] text-amber-100" id="btn-open-infra">
      <span class="text-base">🏛️</span>
      <span>관영시설</span>
    </button>
    <button id="btn-advance-turn" class="flex-1 min-w-[62px] max-w-[85px] py-1 bg-gradient-to-b from-emerald-800 to-emerald-950 border-2 border-emerald-400 rounded-lg flex flex-col items-center justify-center text-[11px] text-emerald-100 font-bold shadow-lg active:scale-95 transition">
      <span class="text-base">⏳</span>
      <span>계절진행</span>
    </button>
  </footer>

  <div id="modal-container" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-3">
    <div class="hanji-card rounded-xl w-full max-w-lg p-5 max-h-[88vh] flex flex-col relative">
      <button id="modal-close-x" class="absolute top-3 right-3 text-stone-600 hover:text-stone-900 text-xl font-bold w-8 h-8 flex items-center justify-center rounded-full hover:bg-stone-300">✕</button>
      
      <div class="border-b-2 border-stone-400 pb-2 mb-3 text-center">
        <h2 id="modal-title" class="font-traditional text-xl font-black text-[#752119]">상소문</h2>
        <p id="modal-subtitle" class="text-xs text-stone-600 mt-0.5">수원유수부 감찰 보고</p>
      </div>

      <div id="modal-body" class="overflow-y-auto pr-1 text-sm leading-relaxed text-stone-800 space-y-3"></div>

      <div id="modal-footer" class="mt-4 pt-2 border-t border-stone-300 flex flex-col gap-2"></div>
    </div>
  </div>

  <script>
    const MAP_SIZE = 16;
    const TILE_W = 64;
    const TILE_H = 32;
    const ELEV_STEP = 20;

    const gameState = {
      turn: 1,
      year: 1776,
      seasonIndex: 0,
      seasons: ['봄', '여름', '가을', '겨울'],
      seasonIcons: ['🌸', '☀️', '🍁', '❄️'],
      
      gold: 2500,
      rice: 1600,
      pop: 120,
      loyalty: 88,
      authority: 70,
      military: 100,
      fortressProgress: 0,
      
      retainers: {
        jeong: false,   // 정약용 (거중기, 축성속도 +80%)
        chae: true,     // 채제공 (공사 예산 절감 20%)
        park: false,    // 박제가 (신해통공 상업수익 +40%)
        baek: false,    // 백동수 (장용영 정예화, 도적 차단)
        kim: false,     // 김홍도 (민심 안정, 문화 번영)
        seo: false,     // 서유구 (농학 생산 +25%)
        guk: false,     // 홍국영 (왕권 강화, 숙위소)
        gu: false,      // 구선복 (군사 급증, 반란 리스크)
        hong: false     // 홍인한 (위험한 급전 지원)
      },

      researchedUigwe: false,
      soundEnabled: true,
      currentTool: 'inspect',
      isPanMode: false,

      research: {
        goguma: false,     // 조엄의 감저(고구마) 구황작물 보급
        gwanong: false,    // 박지원 과농소초 & 수차 보급
        seed: false,       // 서유구 우량 벼 품종 개량
        fertilizer: false, // 녹비·퇴비 시비법 혁신
        reservoir: false   // 만석거 관개 정비
      },

      trade: {
        autoBuyRice: true,
        totalImportedRice: 0
      },

      milestones: {
        wonhaeng1789: false, // 1789년 현륭원 원행 & 배다리
        eulmyo1795: false    // 1795년 을묘년 화성 원행 8일간의 축제
      },
      lastEventTurn: 0
    };

    const undoStack = [];
    const MAX_UNDO = 40;

    const quests = [
      {
        id: 'office',
        title: "제1교지: 행정 사령탑(동헌) 설치",
        desc: "개혁 신도시의 기틀이 될 수원유수부 동헌을 평지에 지으십시오.",
        tool: 'office',
        btnText: "동헌 터 잡기",
        check: () => {
          for (let y = 0; y < MAP_SIZE; y++) {
            for (let x = 0; x < MAP_SIZE; x++) {
              if (tileGrid[y][x].building === 'office') return true;
            }
          }
          return false;
        },
        reward: { gold: 200, rice: 100, msg: "동헌이 완공되어 행정 체계가 수립되었습니다! (+🪙200, +🌾100)" }
      },
      {
        id: 'road',
        title: "제2교지: 삼남대로 5칸 개설",
        desc: "동헌과 이어지는 큰길(삼남대로)을 드래그하여 물류망을 뚫으십시오.",
        tool: 'road',
        btnText: "도로 닦기",
        check: () => {
          let count = 0;
          for (let y = 0; y < MAP_SIZE; y++) {
            for (let x = 0; x < MAP_SIZE; x++) {
              if (tileGrid[y][x].building === 'road') count++;
            }
          }
          return count >= 5;
        },
        reward: { gold: 150, rice: 50, msg: "삼남대로가 뚫려 보부상과 유민들이 모여듭니다! (+🪙150)" }
      },
      {
        id: 'seojangdae',
        title: "제3교지: 팔달산 서장대(西將臺) 축조",
        desc: "팔달산 정상에 군사 총지휘소 [서장대]를 축조하십시오.",
        tool: 'seojangdae',
        btnText: "서장대 축조",
        check: () => {
          for (let y = 0; y < MAP_SIZE; y++) {
            for (let x = 0; x < MAP_SIZE; x++) {
              if (tileGrid[y][x].building === 'seojangdae') return true;
            }
          }
          return false;
        },
        reward: { gold: 150, loyalty: 5, msg: "서장대가 세워져 팔달산 정상에서 사방을 감제합니다! (+🪙150, ❤️+5%)" }
      },
      {
        id: 'bongdon',
        title: "제4교지: 화성 봉돈(烽墩) 축조",
        desc: "팔달산 능선에 위급을 알리는 5연 굴뚝 [봉돈]을 축조하십시오.",
        tool: 'bongdon',
        btnText: "봉돈 축조",
        check: () => {
          for (let y = 0; y < MAP_SIZE; y++) {
            for (let x = 0; x < MAP_SIZE; x++) {
              if (tileGrid[y][x].building === 'bongdon') return true;
            }
          }
          return false;
        },
        reward: { gold: 150, loyalty: 5, msg: "봉돈이 축조되어 주야간 군사 통신망이 완비되었습니다! (+🪙150, ❤️+5%)" }
      },
      {
        id: 'civil_zoning',
        title: "제5교지: 백성 구획 및 공동 우물 조성",
        desc: "방·리(주거), 저잣거리(상업), 둔전(농업) 구획을 지정하고 우물을 파십시오.",
        tool: 'well',
        btnText: "우물 파기",
        check: () => {
          let hasZone = false, hasWell = false;
          for (let y = 0; y < MAP_SIZE; y++) {
            for (let x = 0; x < MAP_SIZE; x++) {
              if (tileGrid[y][x].zone || (tileGrid[y][x].building && (tileGrid[y][x].building.startsWith('res') || tileGrid[y][x].building.startsWith('com') || tileGrid[y][x].building.startsWith('agr')))) hasZone = true;
              if (tileGrid[y][x].building === 'well') hasWell = true;
            }
          }
          return hasZone && hasWell;
        },
        reward: { gold: 300, rice: 200, msg: "백성들이 정착하고 신도시가 활기를 띱니다! (+🪙300, +🌾200)" }
      },
      {
        id: 'wall_build',
        title: "제6교지: 화성 성곽 축조 및 완공",
        desc: "화성 성곽을 드래그하여 둘러치고 24년 내에 100% 완공을 달성하십시오.",
        tool: 'wall',
        btnText: "성곽 축조",
        check: () => gameState.fortressProgress >= 100,
        reward: { gold: 1000, authority: 30, msg: "축하하옵니다! 수원화성 성곽이 완벽히 완공되었습니다!" }
      }
    ];

    let currentQuestIndex = 0;

    const tileGrid = [];
    for (let y = 0; y < MAP_SIZE; y++) {
      tileGrid[y] = [];
      for (let x = 0; x < MAP_SIZE; x++) {
        let elevation = 1;
        let terrain = 'plain';

        if (x <= 4 && y <= 4) {
          elevation = 4 - Math.max(x, y);
          terrain = 'mountain';
        } else if (x <= 5 && y <= 5 && (x + y <= 7)) {
          elevation = 2;
          terrain = 'mountain';
        }

        if ((x === 8 && y >= 0 && y <= 6) || 
            (x === 9 && y >= 6 && y <= 11) || 
            (x === 8 && y >= 11 && y < MAP_SIZE)) {
          elevation = 0;
          terrain = 'water';
        }

        tileGrid[y][x] = {
          x, y,
          elevation: elevation,
          terrain: terrain,
          building: null,
          zone: null,
          level: 1,
          smokeOffset: Math.random() * 10
        };
      }
    }

    let nativeAudioCtx = null;

    function initNativeAudio() {
      try {
        if (!nativeAudioCtx) {
          const AudioClass = window.AudioContext || window.webkitAudioContext;
          if (AudioClass) {
            nativeAudioCtx = new AudioClass();
          }
        }
        if (nativeAudioCtx && nativeAudioCtx.state === 'suspended') {
          nativeAudioCtx.resume().catch(() => {});
        }
      } catch (e) {
        nativeAudioCtx = null;
      }
    }

    function playSound(type) {
      if (!gameState.soundEnabled) return;
      initNativeAudio();
      if (!nativeAudioCtx) return;

      try {
        const now = nativeAudioCtx.currentTime;
        const osc = nativeAudioCtx.createOscillator();
        const gain = nativeAudioCtx.createGain();
        osc.connect(gain);
        gain.connect(nativeAudioCtx.destination);

        if (type === 'hammer') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(140, now);
          osc.frequency.exponentialRampToValueAtTime(45, now + 0.12);
          gain.gain.setValueAtTime(0.35, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
          osc.start(now);
          osc.stop(now + 0.12);
        } else if (type === 'wall') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(95, now);
          osc.frequency.exponentialRampToValueAtTime(30, now + 0.25);
          gain.gain.setValueAtTime(0.6, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        } else if (type === 'coin') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(659.25, now);
          osc.frequency.setValueAtTime(987.77, now + 0.08);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        } else if (type === 'season') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(392.00, now);
          osc.frequency.setValueAtTime(523.25, now + 0.15);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
          osc.start(now);
          osc.stop(now + 0.6);
        } else if (type === 'demolish') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(120, now);
          osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);
          gain.gain.setValueAtTime(0.4, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        } else if (type === 'error') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(160, now);
          osc.frequency.setValueAtTime(110, now + 0.1);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        }
      } catch (err) {}
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const viewport = document.getElementById('viewport');

    const camera = {
      x: 0,
      y: 0,
      zoom: 1.0,
      minZoom: 0.55,
      maxZoom: 2.2
    };

    function centerCamera() {
      const w = canvas.width || viewport.clientWidth || 800;
      const h = canvas.height || viewport.clientHeight || 600;
      camera.zoom = window.innerWidth < 640 ? 0.85 : 1.1;
      camera.x = w / 2;
      camera.y = Math.max(50, h * 0.20);
    }

    function resizeCanvas() {
      const rect = viewport.getBoundingClientRect();
      const w = Math.floor(rect.width) || window.innerWidth || 800;
      const h = Math.floor(rect.height) || (window.innerHeight - 100) || 600;

      if (w > 0 && h > 0 && (canvas.width !== w || canvas.height !== h)) {
        canvas.width = w;
        canvas.height = h;
      }
      if (camera.x === 0 || camera.y === 0 || isNaN(camera.x) || isNaN(camera.y)) {
        centerCamera();
      }
    }

    window.addEventListener('resize', resizeCanvas);
    if (window.ResizeObserver) {
      const ro = new ResizeObserver(() => resizeCanvas());
      ro.observe(viewport);
    }

    function getCanvasPos(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
      };
    }

    function gridToScreen(gx, gy, elev = 0) {
      const halfW = (TILE_W / 2) * camera.zoom;
      const halfH = (TILE_H / 2) * camera.zoom;
      const sx = (gx - gy) * halfW + camera.x;
      const sy = (gx + gy) * halfH - (elev * ELEV_STEP * camera.zoom) + camera.y;
      return { x: sx, y: sy };
    }

    function screenToGrid(sx, sy) {
      const halfW = (TILE_W / 2) * camera.zoom;
      const halfH = (TILE_H / 2) * camera.zoom;
      
      const candidates = [];
      for (let y = 0; y < MAP_SIZE; y++) {
        for (let x = 0; x < MAP_SIZE; x++) {
          candidates.push(tileGrid[y][x]);
        }
      }
      candidates.sort((a, b) => (b.elevation * 100 + b.x + b.y) - (a.elevation * 100 + a.x + a.y));

      for (const tile of candidates) {
        const pos = gridToScreen(tile.x, tile.y, tile.elevation);
        const cx = pos.x;
        const cy = pos.y + halfH;
        const distNorm = Math.abs(sx - cx) / halfW + Math.abs(sy - cy) / halfH;
        if (distNorm <= 1.0) {
          return { x: tile.x, y: tile.y };
        }
      }
      
      const u = (sx - camera.x) / halfW;
      const v = (sy - camera.y - halfH) / halfH;
      const gx = Math.floor((u + v) / 2);
      const gy = Math.floor((v - u) / 2);
      return { 
        x: Math.max(0, Math.min(MAP_SIZE - 1, gx)), 
        y: Math.max(0, Math.min(MAP_SIZE - 1, gy)) 
      };
    }

    function getPalette() {
      switch (gameState.seasonIndex) {
        case 0:
          return {
            plain: '#5c8734',
            plainTop: '#6fa13f',
            mountain: '#476924',
            mountainTop: '#547d2b',
            water: '#357ebd',
            waterDeep: '#23598a',
            cliffWest: '#704f32',
            cliffEast: '#543b24',
            road: '#ba975d'
          };
        case 1:
          return {
            plain: '#247031',
            plainTop: '#2b873c',
            mountain: '#185223',
            mountainTop: '#1e662c',
            water: '#1976d2',
            waterDeep: '#0f5298',
            cliffWest: '#634428',
            cliffEast: '#4a321d',
            road: '#9e7e49'
          };
        case 2:
          return {
            plain: '#9c7324',
            plainTop: '#b6872a',
            mountain: '#7a3814',
            mountainTop: '#914319',
            water: '#427083',
            waterDeep: '#2a4b59',
            cliffWest: '#5c3f25',
            cliffEast: '#48301b',
            road: '#8f6d42'
          };
        case 3:
          return {
            plain: '#d5dfea',
            plainTop: '#eaf0f6',
            mountain: '#879bb1',
            mountainTop: '#9fb3c9',
            water: '#52677e',
            waterDeep: '#39495a',
            cliffWest: '#47423c',
            cliffEast: '#35312c',
            road: '#b5bdc9'
          };
        default:
          return {
            plain: '#5c8734',
            plainTop: '#6fa13f',
            mountain: '#476924',
            mountainTop: '#547d2b',
            water: '#357ebd',
            waterDeep: '#23598a',
            cliffWest: '#704f32',
            cliffEast: '#543b24',
            road: '#ba975d'
          };
      }
    }

    let animationTime = 0;

    const seasonParticles = [];
    const MAX_PARTICLES = 36;
    for (let i = 0; i < MAX_PARTICLES; i++) {
      seasonParticles.push({
        x: Math.random() * 1200,
        y: Math.random() * 800,
        speedX: (Math.random() - 0.5) * 1.6,
        speedY: 0.6 + Math.random() * 1.4,
        size: 2 + Math.random() * 3,
        rot: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.05
      });
    }

    function drawSeasonParticles() {
      const w = canvas.width || 800;
      const h = canvas.height || 600;
      const season = gameState.seasonIndex;
      ctx.save();

      seasonParticles.forEach(p => {
        p.x += p.speedX;
        p.y += p.speedY;
        p.rot += p.rotSpeed;

        if (p.y > h + 10) { p.y = -10; p.x = Math.random() * w; }
        if (p.x < -10) p.x = w + 10;
        if (p.x > w + 10) p.x = -10;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);

        if (season === 0) {
          ctx.fillStyle = 'rgba(251, 182, 206, 0.75)';
          ctx.beginPath();
          ctx.ellipse(0, 0, p.size * 1.4, p.size * 0.7, 0, 0, Math.PI * 2);
          ctx.fill();
        } else if (season === 1) {
          ctx.fillStyle = 'rgba(254, 240, 138, 0.55)';
          ctx.beginPath();
          ctx.arc(0, 0, p.size * 0.65, 0, Math.PI * 2);
          ctx.fill();
        } else if (season === 2) {
          ctx.fillStyle = (p.size > 3.4) ? 'rgba(220, 38, 38, 0.75)' : 'rgba(234, 179, 8, 0.8)';
          ctx.beginPath();
          ctx.ellipse(0, 0, p.size * 1.3, p.size * 0.8, 0, 0, Math.PI * 2);
          ctx.fill();
        } else if (season === 3) {
          ctx.fillStyle = 'rgba(248, 250, 252, 0.85)';
          ctx.beginPath();
          ctx.arc(0, 0, p.size * 0.8, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      });

      ctx.restore();
    }

    function render() {
      animationTime += 0.03;
      if (!canvas.width || !canvas.height) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const pal = getPalette();
      const halfW = (TILE_W / 2) * camera.zoom;
      const halfH = (TILE_H / 2) * camera.zoom;

      for (let y = 0; y < MAP_SIZE; y++) {
        for (let x = 0; x < MAP_SIZE; x++) {
          const tile = tileGrid[y][x];
          const elev = tile.elevation;
          const pos = gridToScreen(x, y, elev);

          // 심시티 2000 스타일 3D 남서측 절벽 단면
          if (y + 1 < MAP_SIZE && tileGrid[y + 1][x].elevation < elev) {
            const lowerElev = tileGrid[y + 1][x].elevation;
            const diff = (elev - lowerElev) * ELEV_STEP * camera.zoom;
            ctx.beginPath();
            ctx.moveTo(pos.x - halfW, pos.y + halfH);
            ctx.lineTo(pos.x, pos.y + halfH * 2);
            ctx.lineTo(pos.x, pos.y + halfH * 2 + diff);
            ctx.lineTo(pos.x - halfW, pos.y + halfH + diff);
            ctx.closePath();
            ctx.fillStyle = pal.cliffWest;
            ctx.fill();
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.lineWidth = 1;
            ctx.stroke();
          }

          // 남동측 절벽 단면
          if (x + 1 < MAP_SIZE && tileGrid[y][x + 1].elevation < elev) {
            const lowerElev = tileGrid[y][x + 1].elevation;
            const diff = (elev - lowerElev) * ELEV_STEP * camera.zoom;
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y + halfH * 2);
            ctx.lineTo(pos.x + halfW, pos.y + halfH);
            ctx.lineTo(pos.x + halfW, pos.y + halfH + diff);
            ctx.lineTo(pos.x, pos.y + halfH * 2 + diff);
            ctx.closePath();
            ctx.fillStyle = pal.cliffEast;
            ctx.fill();
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.lineWidth = 1;
            ctx.stroke();
          }

          // 타일 상단 지표면 다이아몬드
          ctx.beginPath();
          ctx.moveTo(pos.x, pos.y);
          ctx.lineTo(pos.x + halfW, pos.y + halfH);
          ctx.lineTo(pos.x, pos.y + halfH * 2);
          ctx.lineTo(pos.x - halfW, pos.y + halfH);
          ctx.closePath();

          if (tile.terrain === 'mountain') {
            ctx.fillStyle = pal.mountainTop;
          } else if (tile.terrain === 'water') {
            ctx.fillStyle = pal.water;
          } else {
            ctx.fillStyle = pal.plainTop;
          }
          ctx.fill();

          ctx.strokeStyle = 'rgba(0, 0, 0, 0.09)';
          ctx.lineWidth = 1;
          ctx.stroke();

          // 구획(Zoning) 지정 표시선
          if (tile.zone && !tile.building) {
            ctx.fillStyle = tile.zone === 'res' ? 'rgba(56, 189, 248, 0.35)' :
                            tile.zone === 'com' ? 'rgba(251, 146, 60, 0.40)' : 'rgba(74, 222, 128, 0.40)';
            ctx.fill();
            ctx.strokeStyle = '#fef08a';
            ctx.lineWidth = 1.5;
            ctx.stroke();
          }

          drawVillageAlleyways(tile, pos, halfW, halfH);
          drawTileStructures(tile, pos, halfW, halfH);
        }
      }

      drawBorderTradeRoutes();
      drawHoverTileCursor(halfW, halfH);
      drawDragPreview(halfW, halfH);
      drawSeasonParticles();

      requestAnimationFrame(render);
    }

    function getBorderRoadConnections() {
      const connections = [];
      for (let x = 0; x < MAP_SIZE; x++) {
        if (tileGrid[0][x].building === 'road') connections.push({ edge: 'north', name: '한양 도성대로', x, y: 0, label: '한양 방면 (40리) 🚩' });
        if (tileGrid[MAP_SIZE - 1][x].building === 'road') connections.push({ edge: 'south', name: '삼남 곡창대로', x, y: MAP_SIZE - 1, label: '호남·삼남대로 (곡창) 🌾' });
      }
      for (let y = 0; y < MAP_SIZE; y++) {
        if (tileGrid[y][0].building === 'road') connections.push({ edge: 'west', name: '남양만 조운 포구', x: 0, y, label: '남양만 조운포구 ⛵' });
        if (tileGrid[y][MAP_SIZE - 1].building === 'road') connections.push({ edge: 'east', name: '영남대로', x: MAP_SIZE - 1, y, label: '영남·동해대로 🧭' });
      }
      return connections;
    }

    function drawBorderTradeRoutes() {
      const connections = getBorderRoadConnections();
      if (!connections.length) return;

      connections.forEach(conn => {
        const tile = tileGrid[conn.y][conn.x];
        const pos = gridToScreen(conn.x, conn.y, tile.elevation);
        const halfH = (TILE_H / 2) * camera.zoom;

        ctx.save();
        ctx.fillStyle = '#fef08a';
        ctx.font = `bold ${Math.max(10, Math.floor(11 * camera.zoom))}px 'Noto Sans KR', sans-serif`;
        ctx.textAlign = 'center';
        ctx.shadowColor = '#000000';
        ctx.shadowBlur = 6;
        ctx.fillText(conn.label, pos.x, pos.y - 12);

        // 쌀 수레 행렬 도트 애니메이션
        const cartOffset = (Math.sin(animationTime * 2 + conn.x) * 4);
        ctx.fillStyle = '#ca8a04';
        ctx.fillRect(pos.x - 6 + cartOffset, pos.y + halfH - 4, 12, 6);
        ctx.fillStyle = '#fef9c3';
        ctx.fillRect(pos.x - 4 + cartOffset, pos.y + halfH - 7, 8, 4);
        ctx.restore();
      });
    }

    function drawVillageAlleyways(tile, pos, halfW, halfH) {
      if (tile.terrain === 'water' || tile.building === 'wall') return;
      const x = tile.x, y = tile.y;
      const hasNeighborBuilt = (dx, dy) => {
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || nx >= MAP_SIZE || ny < 0 || ny >= MAP_SIZE) return false;
        const nt = tileGrid[ny][nx];
        return nt.building || nt.zone;
      };

      if (!tile.building && !tile.zone) return;

      ctx.save();
      ctx.strokeStyle = 'rgba(180, 140, 80, 0.35)';
      ctx.lineWidth = Math.max(1.5, 2.5 * camera.zoom);
      ctx.beginPath();

      if (hasNeighborBuilt(1, 0)) {
        ctx.moveTo(pos.x, pos.y + halfH);
        ctx.lineTo(pos.x + halfW * 0.6, pos.y + halfH * 1.3);
      }
      if (hasNeighborBuilt(-1, 0)) {
        ctx.moveTo(pos.x, pos.y + halfH);
        ctx.lineTo(pos.x - halfW * 0.6, pos.y + halfH * 0.7);
      }
      if (hasNeighborBuilt(0, 1)) {
        ctx.moveTo(pos.x, pos.y + halfH);
        ctx.lineTo(pos.x - halfW * 0.6, pos.y + halfH * 1.3);
      }
      if (hasNeighborBuilt(0, -1)) {
        ctx.moveTo(pos.x, pos.y + halfH);
        ctx.lineTo(pos.x + halfW * 0.6, pos.y + halfH * 0.7);
      }
      ctx.stroke();
      ctx.restore();
    }

    function drawTileStructures(tile, pos, halfW, halfH) {
      const b = tile.building;
      if (!b) return;

      ctx.save();

      // 1. 삼남대로 (도로)
      if (b === 'road') {
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y + halfH * 0.3);
        ctx.lineTo(pos.x + halfW * 0.7, pos.y + halfH);
        ctx.lineTo(pos.x, pos.y + halfH * 1.7);
        ctx.lineTo(pos.x - halfW * 0.7, pos.y + halfH);
        ctx.closePath();
        ctx.fillStyle = '#b38d4f';
        ctx.fill();
        ctx.strokeStyle = '#856430';
        ctx.lineWidth = 1;
        ctx.stroke();

        // 보부상 / 백성 도트 캐릭터
        const pedOffset = Math.sin(animationTime * 1.5 + tile.x * 2) * 5;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(pos.x + pedOffset, pos.y + halfH - 2, 2.5 * camera.zoom, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#8b5a2b';
        ctx.fillRect(pos.x + pedOffset - 2, pos.y + halfH - 1, 4 * camera.zoom, 4 * camera.zoom);
        ctx.restore();
        return;
      }

      // 2. 수원화성 성곽 (벽돌 체성, 여장, 성문, 수문)
      if (b === 'wall') {
        const isWater = tile.terrain === 'water';
        const hasRoad = (tile.x > 0 && tileGrid[tile.y][tile.x - 1].building === 'road') ||
                        (tile.x + 1 < MAP_SIZE && tileGrid[tile.y][tile.x + 1].building === 'road') ||
                        (tile.y > 0 && tileGrid[tile.y - 1][tile.x].building === 'road') ||
                        (tile.y + 1 < MAP_SIZE && tileGrid[tile.y + 1][tile.x].building === 'road');

        if (isWater) {
          // 수원화성 화홍문 (7련 홍예 수문)
          const archH = 26 * camera.zoom;
          ctx.fillStyle = '#78716c';
          ctx.fillRect(pos.x - halfW * 0.75, pos.y + halfH - archH, halfW * 1.5, archH);

          // 7련 아치 수문 구멍
          ctx.fillStyle = '#0284c7';
          for (let i = -3; i <= 3; i++) {
            ctx.beginPath();
            ctx.arc(pos.x + i * 5 * camera.zoom, pos.y + halfH, 2.5 * camera.zoom, Math.PI, 0);
            ctx.fill();
          }

          // 화홍문 단청 누각
          ctx.fillStyle = '#b91c1c';
          ctx.fillRect(pos.x - halfW * 0.5, pos.y + halfH - archH - 10 * camera.zoom, halfW, 10 * camera.zoom);
          ctx.fillStyle = '#1e293b';
          ctx.beginPath();
          ctx.moveTo(pos.x, pos.y + halfH - archH - 16 * camera.zoom);
          ctx.lineTo(pos.x + halfW * 0.65, pos.y + halfH - archH - 9 * camera.zoom);
          ctx.lineTo(pos.x - halfW * 0.65, pos.y + halfH - archH - 9 * camera.zoom);
          ctx.fill();
        } else if (hasRoad) {
          // 수원화성 4대문 (홍예문 + 옹성 + 2층 단청 문루)
          const gateH = 28 * camera.zoom;
          // 홍예 기단석
          ctx.fillStyle = '#57534e';
          ctx.fillRect(pos.x - halfW * 0.7, pos.y + halfH - gateH, halfW * 1.4, gateH);
          // 아치 문
          ctx.fillStyle = '#1c1917';
          ctx.beginPath();
          ctx.arc(pos.x, pos.y + halfH, 6 * camera.zoom, Math.PI, 0);
          ctx.fill();

          // 반원형 옹성 담장
          ctx.strokeStyle = '#78716c';
          ctx.lineWidth = 3 * camera.zoom;
          ctx.beginPath();
          ctx.arc(pos.x, pos.y + halfH + 4 * camera.zoom, halfW * 0.7, 0, Math.PI);
          ctx.stroke();

          // 2층 문루 (단청 기와)
          ctx.fillStyle = '#dc2626';
          ctx.fillRect(pos.x - halfW * 0.45, pos.y + halfH - gateH - 12 * camera.zoom, halfW * 0.9, 12 * camera.zoom);
          ctx.fillStyle = '#0f172a';
          ctx.beginPath();
          ctx.moveTo(pos.x, pos.y + halfH - gateH - 18 * camera.zoom);
          ctx.lineTo(pos.x + halfW * 0.6, pos.y + halfH - gateH - 11 * camera.zoom);
          ctx.lineTo(pos.x - halfW * 0.6, pos.y + halfH - gateH - 11 * camera.zoom);
          ctx.fill();

          // 펄럭이는 붉은 군기
          ctx.fillStyle = '#ef4444';
          ctx.beginPath();
          ctx.moveTo(pos.x + halfW * 0.4, pos.y + halfH - gateH - 18 * camera.zoom);
          ctx.lineTo(pos.x + halfW * 0.4 + 8 * camera.zoom, pos.y + halfH - gateH - 15 * camera.zoom);
          ctx.lineTo(pos.x + halfW * 0.4, pos.y + halfH - gateH - 12 * camera.zoom);
          ctx.fill();
        } else {
          // 표준 전돌 성벽 (체성과 여장)
          const wallH = 18 * camera.zoom;
          ctx.fillStyle = '#44403c';
          ctx.beginPath();
          ctx.moveTo(pos.x - halfW * 0.6, pos.y + halfH);
          ctx.lineTo(pos.x, pos.y + halfH * 1.5);
          ctx.lineTo(pos.x, pos.y + halfH * 1.5 - wallH);
          ctx.lineTo(pos.x - halfW * 0.6, pos.y + halfH - wallH);
          ctx.fill();

          ctx.fillStyle = '#57534e';
          ctx.beginPath();
          ctx.moveTo(pos.x, pos.y + halfH * 1.5);
          ctx.lineTo(pos.x + halfW * 0.6, pos.y + halfH);
          ctx.lineTo(pos.x + halfW * 0.6, pos.y + halfH - wallH);
          ctx.lineTo(pos.x, pos.y + halfH * 1.5 - wallH);
          ctx.fill();

          ctx.fillStyle = '#78716c';
          ctx.beginPath();
          ctx.moveTo(pos.x, pos.y + halfH * 0.5 - wallH);
          ctx.lineTo(pos.x + halfW * 0.6, pos.y + halfH - wallH);
          ctx.lineTo(pos.x, pos.y + halfH * 1.5 - wallH);
          ctx.lineTo(pos.x - halfW * 0.6, pos.y + halfH - wallH);
          ctx.fill();

          // 여장 총안(활/총 쏘는 틈)
          ctx.fillStyle = '#1c1917';
          ctx.fillRect(pos.x - 3 * camera.zoom, pos.y + halfH - wallH - 3 * camera.zoom, 6 * camera.zoom, 2.5 * camera.zoom);
        }
        ctx.restore();
        return;
      }

      // 3. 우물
      if (b === 'well') {
        ctx.fillStyle = '#64748b';
        ctx.fillRect(pos.x - 8 * camera.zoom, pos.y + halfH * 0.6, 16 * camera.zoom, 10 * camera.zoom);
        ctx.fillStyle = '#0284c7';
        ctx.fillRect(pos.x - 5 * camera.zoom, pos.y + halfH * 0.6 + 2, 10 * camera.zoom, 6 * camera.zoom);
        ctx.fillStyle = '#d97706';
        ctx.fillRect(pos.x + 8 * camera.zoom, pos.y + halfH * 0.6 + 2, 4 * camera.zoom, 5 * camera.zoom);
        ctx.restore();
        return;
      }

      // 4. 수원유수부 동헌 (행정 관아)
      if (b === 'office') {
        const offH = 22 * camera.zoom;
        ctx.fillStyle = '#e2d4b7';
        ctx.fillRect(pos.x - 16 * camera.zoom, pos.y + halfH - offH + 6 * camera.zoom, 32 * camera.zoom, 16 * camera.zoom);
        ctx.fillStyle = '#b91c1c';
        ctx.fillRect(pos.x - 14 * camera.zoom, pos.y + halfH - offH + 8 * camera.zoom, 6 * camera.zoom, 14 * camera.zoom);
        ctx.fillRect(pos.x + 8 * camera.zoom, pos.y + halfH - offH + 8 * camera.zoom, 6 * camera.zoom, 14 * camera.zoom);
        // 팔작지붕
        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y + halfH - offH - 8 * camera.zoom);
        ctx.lineTo(pos.x + 22 * camera.zoom, pos.y + halfH - offH + 6 * camera.zoom);
        ctx.lineTo(pos.x - 22 * camera.zoom, pos.y + halfH - offH + 6 * camera.zoom);
        ctx.fill();
        ctx.restore();
        return;
      }

      // 5. 팔달산 서장대
      if (b === 'seojangdae') {
        const jH = 26 * camera.zoom;
        ctx.fillStyle = '#a8a29e';
        ctx.fillRect(pos.x - 14 * camera.zoom, pos.y + halfH - jH + 10 * camera.zoom, 28 * camera.zoom, 14 * camera.zoom);
        ctx.fillStyle = '#dc2626';
        ctx.fillRect(pos.x - 10 * camera.zoom, pos.y + halfH - jH + 2 * camera.zoom, 20 * camera.zoom, 8 * camera.zoom);
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y + halfH - jH - 6 * camera.zoom);
        ctx.lineTo(pos.x + 18 * camera.zoom, pos.y + halfH - jH + 2 * camera.zoom);
        ctx.lineTo(pos.x - 18 * camera.zoom, pos.y + halfH - jH + 2 * camera.zoom);
        ctx.fill();
        ctx.restore();
        return;
      }

      // 6. 화성 봉돈 (5연 굴뚝 봉수대)
      if (b === 'bongdon') {
        const bH = 16 * camera.zoom;
        ctx.fillStyle = '#78716c';
        ctx.fillRect(pos.x - 16 * camera.zoom, pos.y + halfH - bH, 32 * camera.zoom, bH);
        // 5연 굴뚝
        for (let i = -2; i <= 2; i++) {
          const cx = pos.x + i * 6 * camera.zoom;
          ctx.fillStyle = '#44403c';
          ctx.fillRect(cx - 2 * camera.zoom, pos.y + halfH - bH - 6 * camera.zoom, 4 * camera.zoom, 6 * camera.zoom);
          // 봉화 연기 애니메이션
          const smY = (animationTime * 8 + i * 2) % 18;
          ctx.fillStyle = 'rgba(220, 220, 220, 0.7)';
          ctx.beginPath();
          ctx.arc(cx, pos.y + halfH - bH - 8 * camera.zoom - smY, 2 + smY * 0.25, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
        return;
      }

      // 7. 주거: 초가삼간(res_1) vs 고래등 기와집(res_2)
      if (b.startsWith('res')) {
        const isGiwa = b === 'res_2';
        const rH = (isGiwa ? 20 : 16) * camera.zoom;
        ctx.fillStyle = '#d7b377';
        ctx.fillRect(pos.x - 12 * camera.zoom, pos.y + halfH - rH + 6 * camera.zoom, 24 * camera.zoom, 12 * camera.zoom);
        // 지붕
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y + halfH - rH - 4 * camera.zoom);
        ctx.lineTo(pos.x + 16 * camera.zoom, pos.y + halfH - rH + 6 * camera.zoom);
        ctx.lineTo(pos.x - 16 * camera.zoom, pos.y + halfH - rH + 6 * camera.zoom);
        ctx.fillStyle = isGiwa ? '#1e293b' : '#b45309';
        ctx.fill();

        // 아궁이 굴뚝 연기
        const smY = (animationTime * 9 + tile.smokeOffset) % 16;
        ctx.fillStyle = 'rgba(240, 240, 240, 0.65)';
        ctx.beginPath();
        ctx.arc(pos.x + 8 * camera.zoom, pos.y + halfH - rH - smY, 2 + smY * 0.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        return;
      }

      // 8. 상업: 저잣거리 난전(com_1) vs 기와 주막(com_2)
      if (b.startsWith('com')) {
        const isBig = b === 'com_2';
        const cH = (isBig ? 18 : 14) * camera.zoom;
        ctx.fillStyle = isBig ? '#991b1b' : '#0d9488';
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y + halfH - cH - 2 * camera.zoom);
        ctx.lineTo(pos.x + 14 * camera.zoom, pos.y + halfH - cH + 6 * camera.zoom);
        ctx.lineTo(pos.x - 14 * camera.zoom, pos.y + halfH - cH + 6 * camera.zoom);
        ctx.fill();

        // 주막 깃발 / 멍석
        ctx.fillStyle = '#fef08a';
        ctx.fillRect(pos.x - 8 * camera.zoom, pos.y + halfH - 2 * camera.zoom, 16 * camera.zoom, 4 * camera.zoom);
        ctx.restore();
        return;
      }

      // 9. 농업: 밭이랑(agr_1) vs 만석거 다랭이논(agr_2)
      if (b.startsWith('agr')) {
        const isRice = b === 'agr_2';
        ctx.fillStyle = (gameState.seasonIndex === 2) ? '#ca8a04' : (isRice ? '#16a34a' : '#854d0e');
        ctx.beginPath();
        ctx.moveTo(pos.x - halfW * 0.5, pos.y + halfH);
        ctx.lineTo(pos.x, pos.y + halfH * 0.5);
        ctx.lineTo(pos.x + halfW * 0.5, pos.y + halfH);
        ctx.lineTo(pos.x, pos.y + halfH * 1.5);
        ctx.fill();
        ctx.restore();
        return;
      }

      // 10. 관영 공공시설 4종 (영빈관, 공업소, 형옥, 의원)
      if (b === 'guesthouse') {
        ctx.fillStyle = '#7c2d12';
        ctx.fillRect(pos.x - 14 * camera.zoom, pos.y + halfH - 16 * camera.zoom, 28 * camera.zoom, 16 * camera.zoom);
        ctx.fillStyle = '#1e3a8a';
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y + halfH - 22 * camera.zoom);
        ctx.lineTo(pos.x + 18 * camera.zoom, pos.y + halfH - 16 * camera.zoom);
        ctx.lineTo(pos.x - 18 * camera.zoom, pos.y + halfH - 16 * camera.zoom);
        ctx.fill();
      } else if (b === 'factory') {
        ctx.fillStyle = '#44403c';
        ctx.fillRect(pos.x - 14 * camera.zoom, pos.y + halfH - 14 * camera.zoom, 28 * camera.zoom, 14 * camera.zoom);
        ctx.fillStyle = '#ea580c';
        ctx.fillRect(pos.x - 4 * camera.zoom, pos.y + halfH - 8 * camera.zoom, 8 * camera.zoom, 6 * camera.zoom);
      } else if (b === 'police') {
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(pos.x - 14 * camera.zoom, pos.y + halfH - 14 * camera.zoom, 28 * camera.zoom, 14 * camera.zoom);
        ctx.fillStyle = '#e2e8f0';
        for (let i = -10; i <= 10; i += 5) {
          ctx.fillRect(pos.x + i * camera.zoom, pos.y + halfH - 10 * camera.zoom, 1.5 * camera.zoom, 8 * camera.zoom);
        }
      } else if (b === 'clinic') {
        ctx.fillStyle = '#fef3c7';
        ctx.fillRect(pos.x - 14 * camera.zoom, pos.y + halfH - 14 * camera.zoom, 28 * camera.zoom, 14 * camera.zoom);
        ctx.fillStyle = '#dc2626';
        ctx.fillRect(pos.x - 2 * camera.zoom, pos.y + halfH - 10 * camera.zoom, 4 * camera.zoom, 8 * camera.zoom);
        ctx.fillRect(pos.x - 5 * camera.zoom, pos.y + halfH - 7 * camera.zoom, 10 * camera.zoom, 3 * camera.zoom);
      }

      ctx.restore();
    }

    // 드래그 청사진 프리뷰
    let dragStartGrid = null;
    let dragCurrentGrid = null;

    function drawDragPreview(halfW, halfH) {
      if (!dragStartGrid || !dragCurrentGrid) return;
      if (gameState.isPanMode || gameState.currentTool === 'inspect') return;

      const path = getDragTiles(dragStartGrid, dragCurrentGrid, gameState.currentTool);
      ctx.save();
      ctx.fillStyle = 'rgba(251, 191, 36, 0.45)';
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 2;

      path.forEach(pt => {
        const tile = tileGrid[pt.y][pt.x];
        const pos = gridToScreen(pt.x, pt.y, tile.elevation);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
        ctx.lineTo(pos.x + halfW, pos.y + halfH);
        ctx.lineTo(pos.x, pos.y + halfH * 2);
        ctx.lineTo(pos.x - halfW, pos.y + halfH);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      });
      ctx.restore();
    }

    function getDragTiles(p1, p2, tool) {
      const tiles = [];
      if (tool.startsWith('zone_') || tool === 'demolish') {
        const minX = Math.min(p1.x, p2.x), maxX = Math.max(p1.x, p2.x);
        const minY = Math.min(p1.y, p2.y), maxY = Math.max(p1.y, p2.y);
        for (let y = minY; y <= maxY; y++) {
          for (let x = minX; x <= maxX; x++) {
            tiles.push({ x, y });
          }
        }
      } else {
        // 직선 드래그 (브레젠험 스타일)
        let x0 = p1.x, y0 = p1.y, x1 = p2.x, y1 = p2.y;
        let dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
        let sx = (x0 < x1) ? 1 : -1, sy = (y0 < y1) ? 1 : -1;
        let err = dx - dy;
        while (true) {
          tiles.push({ x: x0, y: y0 });
          if (x0 === x1 && y0 === y1) break;
          let e2 = 2 * err;
          if (e2 > -dy) { err -= dy; x0 += sx; }
          if (e2 < dx) { err += dx; y0 += sy; }
        }
      }
      return tiles;
    }

    // 마우스 / 터치 포인터 인터랙션
    function drawHoverTileCursor(halfW, halfH) {
      if (!hoverTile || isPointerDown || isMiddlePanning || gameState.isPanMode) return;
      if (hoverTile.x < 0 || hoverTile.x >= MAP_SIZE || hoverTile.y < 0 || hoverTile.y >= MAP_SIZE) return;

      const tile = tileGrid[hoverTile.y][hoverTile.x];
      const pos = gridToScreen(tile.x, tile.y, tile.elevation);

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
      ctx.lineTo(pos.x + halfW, pos.y + halfH);
      ctx.lineTo(pos.x, pos.y + halfH * 2);
      ctx.lineTo(pos.x - halfW, pos.y + halfH);
      ctx.closePath();

      if (gameState.currentTool === 'demolish') {
        ctx.fillStyle = 'rgba(239, 68, 68, 0.25)';
        ctx.strokeStyle = '#ef4444';
      } else if (gameState.currentTool === 'inspect') {
        ctx.fillStyle = 'rgba(56, 189, 248, 0.20)';
        ctx.strokeStyle = '#38bdf8';
      } else {
        ctx.fillStyle = 'rgba(251, 191, 36, 0.25)';
        ctx.strokeStyle = '#fbbf24';
      }
      ctx.lineWidth = 2;
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    let isPointerDown = false;
    let isMiddlePanning = false;
    let hoverTile = null;
    let pointerDownScreen = { x: 0, y: 0 };
    let lastScreenPos = { x: 0, y: 0 };

    // 마우스 휠 클릭(Middle Click) 맵 이동 (패닝)
    viewport.addEventListener('mousedown', e => {
      if (e.button === 1) { // 휠 클릭
        e.preventDefault();
        isMiddlePanning = true;
        lastScreenPos = { x: e.clientX, y: e.clientY };
        viewport.style.cursor = 'grabbing';
      }
    });

    viewport.addEventListener('auxclick', e => {
      if (e.button === 1) e.preventDefault();
    });

    window.addEventListener('mouseup', e => {
      if (isMiddlePanning && (e.button === 1 || e.buttons === 0)) {
        isMiddlePanning = false;
        viewport.style.cursor = gameState.isPanMode ? 'grab' : 'crosshair';
      }
    });

    // 마우스 휠 스크롤 줌 인/아웃
    viewport.addEventListener('wheel', e => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.12 : 0.88;
      const newZoom = Math.max(camera.minZoom, Math.min(camera.maxZoom, camera.zoom * zoomFactor));
      const cPos = getCanvasPos(e.clientX, e.clientY);
      camera.x = cPos.x - (cPos.x - camera.x) * (newZoom / camera.zoom);
      camera.y = cPos.y - (cPos.y - camera.y) * (newZoom / camera.zoom);
      camera.zoom = newZoom;
    }, { passive: false });

    viewport.addEventListener('pointerdown', e => {
      if (e.button === 1) return; // 휠 클릭은 mousedown에서 처리
      if (e.button !== 0 && e.pointerType === 'mouse') return; // 좌클릭/터치만 처리

      isPointerDown = true;
      pointerDownScreen = { x: e.clientX, y: e.clientY };
      lastScreenPos = { x: e.clientX, y: e.clientY };
      
      const cPos = getCanvasPos(e.clientX, e.clientY);
      const g = screenToGrid(cPos.x, cPos.y);
      dragStartGrid = g;
      dragCurrentGrid = g;
    });

    window.addEventListener('pointermove', e => {
      const cPos = getCanvasPos(e.clientX, e.clientY);
      if (cPos.x >= 0 && cPos.x <= canvas.width && cPos.y >= 0 && cPos.y <= canvas.height) {
        hoverTile = screenToGrid(cPos.x, cPos.y);
      } else {
        hoverTile = null;
      }

      if (isMiddlePanning) {
        const dx = e.clientX - lastScreenPos.x;
        const dy = e.clientY - lastScreenPos.y;
        camera.x += dx;
        camera.y += dy;
        lastScreenPos = { x: e.clientX, y: e.clientY };
        return;
      }

      if (!isPointerDown) return;
      const dx = e.clientX - lastScreenPos.x;
      const dy = e.clientY - lastScreenPos.y;

      if (gameState.isPanMode || (gameState.currentTool === 'inspect' && Math.hypot(e.clientX - pointerDownScreen.x, e.clientY - pointerDownScreen.y) > 6)) {
        camera.x += dx;
        camera.y += dy;
        lastScreenPos = { x: e.clientX, y: e.clientY };
      } else {
        dragCurrentGrid = screenToGrid(cPos.x, cPos.y);
      }
    });

    window.addEventListener('pointerup', e => {
      if (isMiddlePanning) {
        isMiddlePanning = false;
        viewport.style.cursor = gameState.isPanMode ? 'grab' : 'crosshair';
        return;
      }
      if (!isPointerDown) return;
      isPointerDown = false;
      const dist = Math.hypot(e.clientX - pointerDownScreen.x, e.clientY - pointerDownScreen.y);

      const cPos = getCanvasPos(e.clientX, e.clientY);
      if (dist < 8 && !gameState.isPanMode) {
        const g = screenToGrid(cPos.x, cPos.y);
        handleTileClick(g.x, g.y);
      } else if (!gameState.isPanMode && gameState.currentTool !== 'inspect' && dragStartGrid && dragCurrentGrid) {
        const tiles = getDragTiles(dragStartGrid, dragCurrentGrid, gameState.currentTool);
        applyBatchBuild(tiles, gameState.currentTool);
      }

      dragStartGrid = null;
      dragCurrentGrid = null;
    });

    function showToast(msg, icon = '📢') {
      const banner = document.getElementById('toast-banner');
      document.getElementById('toast-icon').innerText = icon;
      document.getElementById('toast-msg').innerText = msg;
      banner.classList.remove('opacity-0', '-translate-y-8');
      banner.classList.add('opacity-100', 'translate-y-0');
      setTimeout(() => {
        banner.classList.remove('opacity-100', 'translate-y-0');
        banner.classList.add('opacity-0', '-translate-y-8');
      }, 2600);
    }

    const TOOL_COSTS = {
      'road': { gold: 20, rice: 0 },
      'wall': { gold: 80, rice: 25 },
      'well': { gold: 50, rice: 10 },
      'zone_res': { gold: 30, rice: 0 },
      'zone_com': { gold: 40, rice: 0 },
      'zone_agr': { gold: 20, rice: 20 },
      'office': { gold: 250, rice: 100 },
      'seojangdae': { gold: 200, rice: 80 },
      'bongdon': { gold: 150, rice: 50 },
      'guesthouse': { gold: 350, rice: 120 },
      'factory': { gold: 400, rice: 150 },
      'police': { gold: 300, rice: 100 },
      'clinic': { gold: 250, rice: 80 }
    };

    function saveUndoSnapshot() {
      const snap = {
        grid: JSON.parse(JSON.stringify(tileGrid)),
        gold: gameState.gold,
        rice: gameState.rice,
        pop: gameState.pop,
        loyalty: gameState.loyalty,
        fortress: gameState.fortressProgress
      };
      undoStack.push(snap);
      if (undoStack.length > MAX_UNDO) undoStack.shift();
      document.getElementById('btn-undo').classList.remove('opacity-40');
    }

    function applyBatchBuild(tiles, tool) {
      if (tool === 'inspect') return;
      saveUndoSnapshot();
      let builtCount = 0;

      tiles.forEach(pt => {
        const tile = tileGrid[pt.y][pt.x];
        if (tool === 'demolish') {
          if (tile.building || tile.zone) {
            tile.building = null;
            tile.zone = null;
            builtCount++;
          }
          return;
        }

        if (tile.building && tool !== 'wall') return; // 이미 건물이 있으면 보호

        let cost = TOOL_COSTS[tool] || { gold: 0, rice: 0 };
        if (gameState.retainers.chae) cost = { gold: Math.floor(cost.gold * 0.8), rice: Math.floor(cost.rice * 0.8) };

        if (gameState.gold < cost.gold || gameState.rice < cost.rice) return;

        if (tool === 'road') {
          if (tile.terrain === 'mountain') return;
          tile.building = 'road';
          tile.zone = null;
        } else if (tool === 'wall') {
          tile.building = 'wall';
        } else if (tool.startsWith('zone_')) {
          if (tile.terrain === 'mountain' || tile.terrain === 'water') return;
          tile.zone = tool.replace('zone_', '');
        }

        gameState.gold -= cost.gold;
        gameState.rice -= cost.rice;
        builtCount++;
      });

      if (builtCount > 0) {
        playSound(tool === 'demolish' ? 'demolish' : 'hammer');
        updateFortressScore();
        updateHUD();
        checkQuestProgress();
      }
    }

    function handleTileClick(x, y) {
      const tile = tileGrid[y][x];

      if (gameState.currentTool === 'inspect') {
        showTileLore(tile);
        return;
      }

      if (gameState.currentTool === 'demolish') {
        if (tile.building || tile.zone) {
          saveUndoSnapshot();
          tile.building = null;
          tile.zone = null;
          playSound('demolish');
          updateFortressScore();
          updateHUD();
        }
        return;
      }

      if (tile.building) {
        playSound('error');
        showToast("이미 건물이 존재합니다. 철거(🚜) 후에 건설하십시오.", "⚠️");
        return;
      }

      const cost = TOOL_COSTS[gameState.currentTool] || { gold: 0, rice: 0 };
      if (gameState.gold < cost.gold || gameState.rice < cost.rice) {
        playSound('error');
        showToast("국고나 군량이 부족하옵니다!", "❌");
        return;
      }

      if (tile.terrain === 'mountain' && !['wall', 'seojangdae', 'bongdon'].includes(gameState.currentTool)) {
        playSound('error');
        showToast("험준한 팔달산에는 관방 시설만 지을 수 있습니다.", "⛰️");
        return;
      }
      if (tile.terrain === 'water' && gameState.currentTool !== 'wall') {
        playSound('error');
        showToast("수원천 물길 위에는 화홍문(성곽)만 축조할 수 있습니다.", "🌊");
        return;
      }

      saveUndoSnapshot();
      gameState.gold -= cost.gold;
      gameState.rice -= cost.rice;

      if (gameState.currentTool.startsWith('zone_')) {
        tile.zone = gameState.currentTool.replace('zone_', '');
      } else {
        tile.building = gameState.currentTool;
        tile.zone = null;
      }

      playSound('hammer');
      updateFortressScore();
      updateHUD();
      checkQuestProgress();
    }

    function showTileLore(tile) {
      let title = "수원의 대지";
      let desc = "삼남대로와 수원천이 지나는 길목입니다. 백성을 모으고 성을 둘러 개혁의 터전을 세우십시오.";

      if (tile.terrain === 'mountain') {
        title = "팔달산(八達山) 능선";
        desc = "사방으로 눈이 트여 사도세자의 묘소(현륭원)와 화성 전역을 수호하는 천혜의 방어 요새입니다.";
      } else if (tile.terrain === 'water') {

    function checkQuestProgress() {
      if (currentQuestIndex >= quests.length) return;
      const q = quests[currentQuestIndex];
      if (q.check()) {
        gameState.gold += q.reward.gold || 0;
        gameState.rice += q.reward.rice || 0;
        gameState.loyalty = Math.min(100, gameState.loyalty + (q.reward.loyalty || 0));
        gameState.authority = Math.min(100, gameState.authority + (q.reward.authority || 0));
        playSound('coin');
        showToast(q.reward.msg, "👑");

        currentQuestIndex++;
        updateQuestUI();
        updateHUD();
      }
    }

    function updateQuestUI() {
      const banner = document.getElementById('quest-banner');
      if (currentQuestIndex >= quests.length) {
        banner.innerHTML = `<span class="text-amber-300 font-bold font-traditional">모든 어명 교지를 완수하셨습니다! 성역을 수호하십시오.</span>`;
        return;
      }
      const q = quests[currentQuestIndex];
      document.getElementById('quest-title').innerText = q.title;
      document.getElementById('quest-desc').innerText = q.desc;
      document.getElementById('btn-quest-action').innerText = q.btnText;
    }

    document.getElementById('btn-quest-action').addEventListener('click', () => {
      if (currentQuestIndex < quests.length) {
        selectTool(quests[currentQuestIndex].tool);
      }
    });

    function updateFortressScore() {
      let wallCount = 0;
      for (let y = 0; y < MAP_SIZE; y++) {
        for (let x = 0; x < MAP_SIZE; x++) {
          if (tileGrid[y][x].building === 'wall') wallCount++;
        }
      }
      const speedMult = gameState.retainers.jeong ? 1.8 : 1.0;
      gameState.fortressProgress = Math.min(100, Math.floor((wallCount / 28) * 100 * speedMult));
    }

    function updateHUD() {
      const turnLabel = `정조 ${gameState.year - 1776 + 1}년(${gameState.year}) ${gameState.seasons[gameState.seasonIndex]} [${gameState.turn}/96턴]`;
      document.getElementById('txt-turn-label').innerText = turnLabel;
      document.getElementById('txt-season-icon').innerText = gameState.seasonIcons[gameState.seasonIndex];
      document.getElementById('hud-gold').innerText = gameState.gold.toLocaleString();
      document.getElementById('hud-rice').innerText = gameState.rice.toLocaleString();
      document.getElementById('hud-pop').innerText = gameState.pop.toLocaleString();
      document.getElementById('hud-loyalty').innerText = `${gameState.loyalty}%`;
      document.getElementById('hud-authority').innerText = gameState.authority;
      document.getElementById('hud-fortress').innerText = `${gameState.fortressProgress}%`;
    }

    // 턴 진행 (계절 변화, 자율 발전, 수입/지출, 이벤트)
    function advanceTurn() {
      gameState.turn++;
      gameState.seasonIndex = (gameState.seasonIndex + 1) % 4;
      if (gameState.seasonIndex === 0) gameState.year++;

      playSound('season');

      let addGold = 0, addRice = 0, addPop = 0;

      for (let y = 0; y < MAP_SIZE; y++) {
        for (let x = 0; x < MAP_SIZE; x++) {
          const tile = tileGrid[y][x];

          // 1. 자율 발전 (인접 도로/우물 체크)
          if (tile.zone && !tile.building) {
            const hasRoadNeighbor = checkNeighbor(x, y, 'road');
            if (hasRoadNeighbor) {
              tile.building = `${tile.zone}_1`;
            }
          } else if (tile.building && tile.building.endsWith('_1')) {
            const hasWellNeighbor = checkNeighbor(x, y, 'well');
            if (hasWellNeighbor && Math.random() < 0.4) {
              tile.building = `${tile.zone}_2`; // 승급
            }
          }

          // 2. 생산 정산
          if (tile.building === 'res_1') addPop += 3;
          if (tile.building === 'res_2') addPop += 8;
          if (tile.building === 'com_1') addGold += 35;
          if (tile.building === 'com_2') addGold += 80;
          if (tile.building === 'agr_1') addRice += 40;
          if (tile.building === 'agr_2') addRice += 100;

          if (tile.building === 'guesthouse') addGold += 120;
          if (tile.building === 'factory') addGold += 150;
        }
      }

      // 인재 버프 적용
      if (gameState.retainers.park) addGold = Math.floor(addGold * 1.4);
      if (gameState.retainers.seo) addRice = Math.floor(addRice * 1.25);
      if (gameState.retainers.hong) { addGold += 350; gameState.loyalty = Math.max(0, gameState.loyalty - 3); }
      if (gameState.retainers.kim) gameState.loyalty = Math.min(100, gameState.loyalty + 2);
      if (gameState.retainers.baek) gameState.military += 10;
      if (gameState.retainers.gu) { gameState.military += 25; addRice -= 20; }

      // 연구 테크 버프
      if (gameState.research.gwanong) addRice = Math.floor(addRice * 1.4);
      if (gameState.research.seed) addRice = Math.floor(addRice * 1.2);
      if (gameState.research.fertilizer) addRice += 60;
      if (gameState.research.reservoir) addRice += 80;

      gameState.gold += addGold;
      gameState.rice += addRice;
      gameState.pop += addPop;

      // 군량 소비
      let riceConsumption = Math.floor(gameState.pop * 0.4 + gameState.military * 0.2);
      if (gameState.research.goguma) riceConsumption = Math.floor(riceConsumption * 0.63);
      gameState.rice -= riceConsumption;

      // 식량 부족 시 대외 자동 매입
      if (gameState.rice < 100 && gameState.trade.autoBuyRice && gameState.gold >= 200) {
        gameState.gold -= 200;
        gameState.rice += 250;
        showToast("삼남 곡창지대에서 긴급 양곡을 매입하여 기근을 면했습니다.", "🌾");
      } else if (gameState.rice < 0) {
        gameState.rice = 0;
        gameState.loyalty = Math.max(0, gameState.loyalty - 18);
        showToast("군량미가 고갈되어 백성들이 굶주리고 있습니다!", "⚠️");
      }

      updateFortressScore();
      updateHUD();
      checkQuestProgress();

      // 이벤트 판정 (3턴 주기 또는 역사 연도)
      if (gameState.year === 1789 && !gameState.milestones.wonhaeng1789) {
        gameState.milestones.wonhaeng1789 = true;
        triggerHistoricWonhaeng1789();
      } else if (gameState.year === 1795 && !gameState.milestones.eulmyo1795) {
        gameState.milestones.eulmyo1795 = true;
        triggerHistoricEulmyo1795();
      } else if (gameState.turn % 3 === 0) {
        triggerInspectorDilemma();
      }

      // 24년(96턴) 엔딩
      if (gameState.turn >= 96) {
        calculateEnding();
      }
    }

    function checkNeighbor(x, y, target) {
      const dirs = [[0,1],[0,-1],[1,0],[-1,0]];
      for (let [dx, dy] of dirs) {
        const nx = x + dx, ny = y + dy;
        if (nx >= 0 && nx < MAP_SIZE && ny >= 0 && ny < MAP_SIZE) {
          if (tileGrid[ny][nx].building === target) return true;
        }
      }
      return false;
    }

        story = "정예 장용외영과 팔달산 서장대, 완벽한 포루·치성이 북방과 해안을 철통 수호합니다. 훗날 외세의 침략을 압도적으로 격퇴하는 자주 국방의 보루가 완성되었습니다.";

            그대는 유수부의 동헌을 세우고, 삼남대로를 닦아 백성을 모으며, 24년 내에 웅장한 수원화성을 완공하여 세도정치의 싹을 잘라내라!"
          </p>`,
          [
            { text: "어명을 받듭니다 (동헌 터 잡기)", primary: true, action: () => { closeModal(); selectTool('office'); } }
          ]
        );
      }, 400);

      requestAnimationFrame(render);
    }

    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      startApplication();
    } else {
      window.addEventListener('DOMContentLoaded', startApplication);
    }
  </script>
